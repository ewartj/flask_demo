[project]
name = "flask-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "requests>=2.33.1",
    "transformers>=5.8.0",
    "wtforms>=3.2.2",
    "torch>=2.0.0",
    "sentencepiece>=0.2.0",
    "gunicorn>=23.0.0",
    "mlflow>=2.0.0",
    "setfit>=1.0.0",
    "pyyaml>=6.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
