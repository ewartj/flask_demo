[project]
name = "flask-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "pandas>=3.0.2",
    "requests>=2.33.1",
    "transformers>=5.8.0",
    "wtforms>=3.2.2",
    "torch>=2.0.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.scripts]
build-ts = "npx esbuild app/static/ts/main.ts --outfile=app/static/js/main.js --bundle --minify"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
