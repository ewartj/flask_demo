services:
  web:
    build: .
    ports:
      - "5005:5005"
    environment:
      # ── Secrets — never put these in config.yaml ───────────────────────────
      SECRET_KEY:            ${SECRET_KEY:-changeme-in-production}
      MLFLOW_TRACKING_TOKEN: ${MLFLOW_TRACKING_TOKEN:-}
      # ── Per-environment overrides (can also be set in config.yaml) ─────────
      MLFLOW_TRACKING_URI:   ${MLFLOW_TRACKING_URI:-}
      FLASK_APP: analysis_app.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
